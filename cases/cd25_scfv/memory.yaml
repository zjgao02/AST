metadata:
  memory_name: CD25_scFv_memory
  status: active
  task_type: AST-guided scFv evolution for CD25 binding optimization
  species_context: human CD25 target; antibody-like binder optimization
  last_manual_update: null
  last_auto_update: '2026-06-01T07:50:11+00:00'
  writable_sections:
  - adaptive_memory
  - optimization_windows
  - run_state
  - template_memory
  - candidate_statistics
  mostly_frozen_sections:
  - ast_definition
  - stable_priors
  - llm_guidance
  - safety_and_guardrails
  read_priority_for_llm:
  - llm_guidance
  - stable_priors.scfv_prior
  - stable_priors.linker_prior
  - stable_priors.aa_prior
  - adaptive_memory
  - optimization_windows
ast_definition:
  root: CD25_scFv_Design_Task
  hierarchy:
    CD25_scFv_Design_Task:
      children:
      - Binder_scFv
      - Target_CD25
      - Interface_System
    Binder_scFv:
      node_type: binder_root
      children:
      - VH_domain
      - Linker_module
      - VL_domain
    VH_domain:
      node_type: domain
      role: heavy_chain_variable_domain
      children:
      - VH_FR1
      - VH_CDR1
      - VH_FR2
      - VH_CDR2
      - VH_FR3
      - VH_CDR3
      - VH_FR4
    Linker_module:
      node_type: connector
      role: vh_vl_orientation_and_flexibility
      children:
      - Linker_head
      - Linker_core
      - Linker_tail
    VL_domain:
      node_type: domain
      role: light_chain_variable_domain
      children:
      - VL_FR1
      - VL_CDR1
      - VL_FR2
      - VL_CDR2
      - VL_FR3
      - VL_CDR3
      - VL_FR4
    Target_CD25:
      node_type: target_root
      children:
      - CD25_global
      - CD25_epitope_candidate
      - CD25_non_epitope
    Interface_System:
      node_type: interaction_context
      children:
      - Paratope_System
      - Presentation_System
      - Developability_System
  region_roles:
    CDR:
      semantic_role: main_functional_interface_motif
      typical_priority: high
    FR:
      semantic_role: structural_support_scaffold
      typical_priority: low
    Linker:
      semantic_role: orientation_and_flexibility_modulator
      typical_priority: medium_low
    Target_epitope_candidate:
      semantic_role: putative_binder-facing_target_patch
      typical_priority: context_dependent
