  scfv_prior:
    general:
      format: single-chain variable fragment
      architecture: VH-Linker-VL
      core_design_principle: 'CDRs are the main functional interface motifs, framework
        regions are primarily structural supports, and linker is primarily a presentation
        and flexibility module.

        '
      preferred_edit_order:
      - VH_CDR3
      - VH_CDR2
      - VL_CDR3
      - VH_CDR1
      - VL_CDR1
      - VL_CDR2
      - Linker_module
      - framework_regions
      edit_budget_bias:
        cdr: high
        linker: low_to_medium
        framework: low
    cdr_importance:
      VH_CDR3: 1.0
      VH_CDR2: 0.78
      VL_CDR3: 0.72
      VH_CDR1: 0.58
      VL_CDR1: 0.52
      VL_CDR2: 0.42
    cdr_design_bias:
      preferred_functional_residue_classes:
      - aromatic
      - polar_uncharged
      - contextual_positive
      - contextual_negative
      favored_residues_sparse:
      - Y
      - W
      - H
      - N
      - Q
      - S
      - T
      - R
      - D
      - E
      disfavored_patterns:
      - long_hydrophobic_runs
      - long_polybasic_runs
      - multi_cysteine_gain
      - overly_flat_low_complexity_loops
      cdr_loop_logic:
        VH_CDR3:
          role: highest_priority_affinity_driver
          tolerance_for_change: highest
          suggested_edit_modes:
          - single_point_mutation
          - small_motif_refinement
          - composition_rebalancing
          - short_pattern_enrichment
        VH_CDR2:
          role: secondary_contact_and_shape_tuner
          tolerance_for_change: medium
          suggested_edit_modes:
          - sparse_point_mutation
          - polarity_adjustment
        VL_CDR3:
          role: supporting_paratope_shaping
          tolerance_for_change: medium
          suggested_edit_modes:
          - sparse_point_mutation
          - aromatic_or_polar_tuning
        remaining_cdrs:
          role: fine_tuning
          tolerance_for_change: medium_low
          suggested_edit_modes:
          - minimal_interpretable_edits
    framework_prior:
      philosophy: 'Framework regions should preserve foldability, maintain antibody-like
        architecture, and support CDR presentation. They are not the primary affinity
        engine.

        '
      edit_policy:
        default: conservative_only
        mutation_rate_bias: low
        allow_when:
        - stability_support_needed
        - solubility_support_needed
        - recurrent_evolve_history_signal
        - local_CDR_presentation_logic
        avoid_when:
        - pure_affinity_chasing_without_supporting_reason
      favored_framework_substitutions:
      - polar_surface_cleanup
      - charge_balance_cleanup
      - conservative_size_matched_substitutions
      framework_disfavored_patterns:
      - buried_hydrophobic_disruption
      - gratuitous_aromatic_inflation
      - multiple_nonconservative_substitutions_in_same_FR_block
    paratope_reasoning_prior:
      concept: 'In absence of explicit residue-contact annotation, treat CDR-facing
        residues as the main latent paratope pool and prioritize edits there.

        '
      latent_paratope_nodes:
      - VH_CDR1
      - VH_CDR2
      - VH_CDR3
      - VL_CDR1
      - VL_CDR2
      - VL_CDR3
      supporting_nonparatope_nodes:
      - VH_FR2
      - VH_FR3
      - VL_FR2
      - VL_FR3
      nonprimary_nodes:
      - Linker_head
      - Linker_core
      - Linker_tail
  linker_prior:
    global_role: vh_vl_orientation_and_flexibility_modulator
    default_sequence: GGGGSGGGGSGGGGS
    default_length: 15
    default_class: flexible_gly_ser_linker
    principles:
    - Preserve linker-like character overall.
    - Use linker edits sparingly.
    - Do not make linker a hydrophobic patch.
    - Do not overload linker with charged runs.
    - Prioritize flexibility and low aggregation over aggressive redesign.
    canonical_templates:
      highly_common:
      - GGGGS
      - GGGGSGGGGS
      - GGGGSGGGGSGGGGS
      moderate_variants:
      - GGGGSAGGGGS
      - GGGGSGSGGSGGGGS
    residue_bias:
      favored:
      - G
      - S
      - A
      - T
      conditionally_allowed:
      - P
      - N
      - Q
      disfavored:
      - W
      - F
      - I
      - L
      - V
      - C
    composition_targets:
      gly_ser_fraction_preferred_min: 0.6
      hydrophobic_fraction_preferred_max: 0.15
      charged_fraction_preferred_max: 0.2
    segmentation:
      Linker_head:
        role: junction_buffer_near_VH
        edit_bias: very_low
      Linker_core:
        role: main_flexibility_body
        edit_bias: low_to_medium
      Linker_tail:
        role: junction_buffer_near_VL
        edit_bias: very_low
    linker_edit_rules:
      use_only_if:
      - recurrent_evolve_signal
      - presentation_logic
      - foldability_support_logic
      avoid_if:
      - using_linker_as_main_affinity_driver
      - introducing_sticky_patch
      - breaking_flexible_character
    length_rules:
      preferred_range:
      - 12
      - 18
      shorter_than_10: risk_of_orientation_or_presentation_penalty
      longer_than_25: risk_of_excessive_flexibility_or_expression_penalty
llm_guidance:
  reading_instructions:
  - Read stable_priors first.
  - Use adaptive_memory only as a soft bias unless recurrence thresholds are met.
  - Prefer AST-aware explanations rather than generic sequence reasoning.
  - When in doubt, preserve framework and focus on CDR-centered refinement.
  reasoning_priority:
  - preserve_scFv_foldability
  - prefer_CDR_centered_interface_edits
  - keep_linker_flexible_and_nonsticky
  - avoid_global_aggregation_risk
  - prefer_sparse_interpretable_mutations
  default_edit_strategy:
    phase_1: VH_CDR3-first focused refinement
    phase_2: supporting CDR tuning
    phase_3: rare linker or framework adjustment if justified by recurrent evidence
  explanation_templates:
    cdr_edit: 'This edit is justified because the selected CDR node is a primary or
      supporting paratope region and can change local recognition with relatively
      limited disruption to overall scFv architecture.

      '
    framework_edit: 'This edit is conservative and should only be used to support
      foldability, solubility, or local CDR presentation rather than to act as the
      main affinity driver.

      '
    linker_edit: 'This edit is secondary and should only be used to tune presentation
      or flexibility, not as the main engine of affinity improvement.

      '
safety_and_guardrails:
  hard_preferences:
    avoid_new_cysteine_by_default: true
    avoid_three_or_more_consecutive_hydrophobic: true
    avoid_three_or_more_consecutive_charged: true
    avoid_excessive_global_hydrophobicity: true
    avoid_polybasic_sticky_designs: true
  soft_preferences:
    preserve_antibody_like_composition: true
    prefer_soluble_surface_logic: true
    prefer_aromatics_sparse_and_targeted: true
    prefer_framework_conservatism: true
  anti_overfitting_rules:
  - Do not update templates from a single outlier sequence.
  - Do not rewrite stable priors based on one run.
  - Do not promote low-complexity motifs unless repeatedly enriched in high-scoring
    candidates.
  - Do not let adaptive memory override basic developability logic.
